plugins {
    id "java-library"
}

dependencies {
    implementation 'org.springframework:spring-web'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.micrometer:micrometer-core'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    def runNaverSmoke = project.findProperty('naverSmoke') == 'true'
    systemProperty 'naver.smoke', runNaverSmoke.toString()
    def envFile = rootProject.file('.env')
    if (runNaverSmoke && envFile.exists()) {
        envFile.eachLine { line ->
            def matcher = line =~ /^\s*(NAVER_API_HUB_API_KEY_ID|NAVER_API_HUB_API_KEY)\s*=(.*)$/
            if (matcher.matches() && System.getenv(matcher.group(1)) == null) {
                environment matcher.group(1), matcher.group(2).trim()
            }
        }
    }

    testLogging {
        events 'skipped'
    }
}
