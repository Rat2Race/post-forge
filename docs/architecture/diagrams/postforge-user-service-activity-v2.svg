<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">PostForge 사용자 서비스 활동 다이어그램</title>
  <desc id="desc">로그인·JWT, 게시글 상세 조회, 가격 판정, AI 채팅의 활동을 다섯 개 수직 스윔레인으로 표현한 UML 스타일 다이어그램</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style><![CDATA[
      .bg { fill: #f8fafc; }
      .lane-user { fill: #f8fafc; }
      .lane-presentation { fill: #eff6ff; }
      .lane-application { fill: #f0fdfa; }
      .lane-domain { fill: #fffbeb; }
      .lane-adapter { fill: #faf5ff; }
      .lane-line { stroke: #94a3b8; stroke-width: 2; }
      .band-line { stroke: #cbd5e1; stroke-width: 2; }
      .header { font: 700 17px "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .band-title { font: 700 17px "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #334155; text-anchor: middle; }
      .title { font: 800 30px "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .subtitle { font: 500 14px "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #64748b; text-anchor: middle; dominant-baseline: middle; }
      .node { stroke-width: 2; rx: 12; filter: url(#shadow); }
      .user-node { fill: #ffffff; stroke: #64748b; }
      .presentation-node { fill: #dbeafe; stroke: #3b82f6; }
      .application-node { fill: #ccfbf1; stroke: #14b8a6; }
      .policy-node { fill: #fef3c7; stroke: #f59e0b; }
      .adapter-node { fill: #f3e8ff; stroke: #a855f7; }
      .success-node { fill: #dcfce7; stroke: #22c55e; }
      .failure-node { fill: #fee2e2; stroke: #ef4444; }
      .neutral-node { fill: #fff7d6; stroke: #d97706; }
      .node-text { font: 650 14px "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #172033; text-anchor: middle; dominant-baseline: middle; }
      .node-sub { font: 500 12px "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
      .connector { fill: none; stroke: #475569; stroke-width: 2.2; stroke-linejoin: round; marker-end: url(#arrow); }
      .branch-label { font: 700 12px "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #475569; text-anchor: middle; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
      .legend { font: 600 12px "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #475569; dominant-baseline: middle; }
    ]]></style>
  </defs>

  <rect class="bg" width="1920" height="1080"/>
  <text class="title" x="960" y="32">PostForge 사용자 서비스 활동 다이어그램</text>
  <text class="subtitle" x="960" y="59">모듈 경계와 클래스 책임을 기준으로 정리한 핵심 사용자 흐름</text>

  <!-- Continuous swimlanes -->
  <rect class="lane-user" x="30" y="75" width="230" height="985"/>
  <rect class="lane-presentation" x="260" y="75" width="310" height="985"/>
  <rect class="lane-application" x="570" y="75" width="450" height="985"/>
  <rect class="lane-domain" x="1020" y="75" width="370" height="985"/>
  <rect class="lane-adapter" x="1390" y="75" width="500" height="985"/>

  <!-- Lane headers -->
  <rect x="30" y="75" width="230" height="50" fill="#e2e8f0"/>
  <rect x="260" y="75" width="310" height="50" fill="#bfdbfe"/>
  <rect x="570" y="75" width="450" height="50" fill="#99f6e4"/>
  <rect x="1020" y="75" width="370" height="50" fill="#fde68a"/>
  <rect x="1390" y="75" width="500" height="50" fill="#e9d5ff"/>
  <text class="header" x="145" y="100">사용자</text>
  <text class="header" x="415" y="100">Presentation</text>
  <text class="header" x="795" y="100">Application Orchestration</text>
  <text class="header" x="1205" y="100">Domain · Policy</text>
  <text class="header" x="1640" y="100">Repository · Outbound Adapter</text>

