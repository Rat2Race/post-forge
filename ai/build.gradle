plugins {
    id "java-library"
}

dependencies {
    implementation platform("org.springframework.ai:spring-ai-bom:${springAiVersion}")
    // OpenAI 모듈은 OkHttp 기반 공식 SDK로 부른다. 스타터가 함께 끌어오는 WebClient(Reactor Netty·HTTP/3 네이티브)는 쓰지 않는다.
    implementation('org.springframework.ai:spring-ai-starter-model-openai') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-webclient'
    }
}
