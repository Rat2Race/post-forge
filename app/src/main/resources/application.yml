app:
  url:
    frontend: ${APP_FRONTEND_BASE_URL}
    api: ${APP_API_BASE_URL}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:${app.url.frontend}}
  oauth2:
    redirect-url: ${app.url.frontend}/oauth2/callback
  email:
    verification-base-url: ${app.url.frontend}/email/verify

server:
  shutdown: graceful

spring:
  profiles:
    default: local
  config:
    import: optional:classpath:application-monitoring.yml
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: 5000

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:0}
    clean-disabled: true

  data:
    redis:
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 1s

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 1000

  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${app.url.api}/login/oauth2/code/google
            scope: profile, email
          naver:
            authorization-grant-type: authorization_code
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: ${app.url.api}/login/oauth2/code/naver
            scope: name, email, nickname
            client-authentication-method: client_secret_post
          kakao:
            authorization-grant-type: authorization_code
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${app.url.api}/login/oauth2/code/kakao
            scope: profile_nickname, account_email
            client-authentication-method: client_secret_post
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

auth:
  login:
    protection:
      enabled: true
      rate-limit-window-seconds: 60
      user-limit-per-window: 10
      ip-limit-per-window: 30
      failure-window-seconds: 300
      failure-limit: 5
      lock-seconds: 300

jwt:
  secret: ${JWT_SECRET}
  accessTokenValidity: 15
  refreshTokenValidity: 7

logging:
  pattern:
    level: "%5p [requestId=%X{requestId}]"
  level:
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY:INFO}
    org.springframework.security.oauth2: ${LOG_LEVEL_SPRING_SECURITY_OAUTH2:INFO}
    dev.iamrat: ${LOG_LEVEL_APP:INFO}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
  writer-with-order-by-keys: true
