# 공통 설정. 환경마다 값이 달라야 하는 항목(DB·Redis 호스트, LLM 기본값, 메일 서버, 프록시 헤더)은
# application-local.yml / application-prod.yml 에만 둔다. 프로필을 지정하지 않으면 local 이다.
app:
  # 도메인만 환경변수로 받고 경로는 여기서 조립한다.
  # 기본값을 두지 않는 이유: 배포 서버에서 환경변수를 빠뜨려도 앱이 그냥 떠버리면
  # localhost로 리다이렉트하는 걸 아무도 모른다. 누락 시 기동 실패가 맞다(AppUrlProperties).
  url:
    frontend: ${APP_FRONTEND_BASE_URL}
    api: ${APP_API_BASE_URL}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:${app.url.frontend}}
  oauth2:
    redirect-url: ${app.url.frontend}/oauth2/callback
  email:
    verification-base-url: ${app.url.frontend}/email/verify
  llm:
    # 주소·모델에 기본값이 없다. 운영은 환경변수가 빠지면 기동에 실패하고, local 프로필만 Ollama 기본값을 덧댄다.
    provider: ${LLM_PROVIDER:ollama}
    api-key: ${OPENAI_API_KEY:}
    chat:
      base-url: ${LLM_CHAT_BASE_URL:${LLM_GATEWAY_BASE_URL}}
      api-key: ${LLM_CHAT_API_KEY:${LLM_GATEWAY_TOKEN:}}
      connect-timeout: ${LLM_CHAT_CONNECT_TIMEOUT:3s}
      read-timeout: ${LLM_CHAT_READ_TIMEOUT:60s}
      publishing-read-timeout: ${LLM_PUBLISHING_READ_TIMEOUT:210s}
      options:
        model: ${LLM_CHAT_MODEL}
    embedding:
      base-url: ${LLM_EMBEDDING_BASE_URL:${LLM_GATEWAY_BASE_URL}}
      api-key: ${LLM_EMBEDDING_API_KEY:${LLM_GATEWAY_TOKEN:${OPENAI_API_KEY:}}}
      connect-timeout: ${LLM_EMBEDDING_CONNECT_TIMEOUT:3s}
      read-timeout: ${LLM_EMBEDDING_READ_TIMEOUT:30s}
      options:
        model: ${LLM_EMBEDDING_MODEL}
        dimensions: ${LLM_EMBEDDING_DIMENSIONS:1024}

server:
  shutdown: graceful

spring:
  profiles:
    default: local
  config:
    import: optional:classpath:application-monitoring.yml
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: 5000

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:0}
    clean-disabled: true

  data:
    redis:
      port: ${REDIS_PORT:6379}

  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: ${LLM_EMBEDDING_DIMENSIONS:1024}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 1000

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${app.url.api}/login/oauth2/code/google
            scope: profile, email
          naver:
            authorization-grant-type: authorization_code
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: ${app.url.api}/login/oauth2/code/naver
            scope: name, email, nickname
            client-authentication-method: client_secret_post
          kakao:
            authorization-grant-type: authorization_code
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${app.url.api}/login/oauth2/code/kakao
            scope: profile_nickname, account_email
            client-authentication-method: client_secret_post
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

source:
  google-news:
    enabled: ${GOOGLE_NEWS_ENABLED:false}
    base-url: ${GOOGLE_NEWS_BASE_URL:https://news.google.com}
    language: ${GOOGLE_NEWS_LANGUAGE:ko}
    country: ${GOOGLE_NEWS_COUNTRY:KR}
    connect-timeout: ${GOOGLE_NEWS_CONNECT_TIMEOUT:3s}
    read-timeout: ${GOOGLE_NEWS_READ_TIMEOUT:10s}
    sections:   # 키는 BoardCategory 이름, 값은 Google 뉴스 한국판(hl=ko, gl=KR) 섹션의 topics 식별자
      NATION: CAAqIQgKIhtDQkFTRGdvSUwyMHZNRFp4WkRNU0FtdHZLQUFQAQ
      WORLD: CAAqJggKIiBDQkFTRWdvSUwyMHZNRGx1YlY4U0FtdHZHZ0pMVWlnQVAB
      BUSINESS: CAAqJggKIiBDQkFTRWdvSUwyMHZNRGx6TVdZU0FtdHZHZ0pMVWlnQVAB
      TECHNOLOGY: CAAqKAgKIiJDQkFTRXdvSkwyMHZNR1ptZHpWbUVnSnJieG9DUzFJb0FBUAE
      ENTERTAINMENT: CAAqJggKIiBDQkFTRWdvSUwyMHZNREpxYW5RU0FtdHZHZ0pMVWlnQVAB
      SPORTS: CAAqJggKIiBDQkFTRWdvSUwyMHZNRFp1ZEdvU0FtdHZHZ0pMVWlnQVAB
      HEALTH: CAAqIQgKIhtDQkFTRGdvSUwyMHZNR3QwTlRFU0FtdHZLQUFQAQ

ingest:
  news:
    launch:
      scheduler:
        enabled: ${INGEST_NEWS_LAUNCH_SCHEDULER_ENABLED:false}
      cron: ${INGEST_NEWS_LAUNCH_CRON:0 */10 * * * *}
      sections: ${INGEST_NEWS_LAUNCH_SECTIONS:TECHNOLOGY,BUSINESS}
      display-count: ${INGEST_NEWS_LAUNCH_DISPLAY_COUNT:5}
      daily-cap: ${INGEST_NEWS_LAUNCH_DAILY_CAP:3}
    digest:
      scheduler:
        enabled: ${INGEST_NEWS_DIGEST_SCHEDULER_ENABLED:false}
      cron: ${INGEST_NEWS_DIGEST_CRON:0 0 6 * * *}

auth:
  login:
    protection:
      enabled: true
      rate-limit-window-seconds: 60
      user-limit-per-window: 10
      ip-limit-per-window: 30
      failure-window-seconds: 300
      failure-limit: 5
      lock-seconds: 300

jwt:
  secret: ${JWT_SECRET}
  accessTokenValidity: 15
  refreshTokenValidity: 7

logging:
  pattern:
    level: "%5p [requestId=%X{requestId}]"
  level:
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY:INFO}
    org.springframework.security.oauth2: ${LOG_LEVEL_SPRING_SECURITY_OAUTH2:INFO}
    dev.iamrat: ${LOG_LEVEL_APP:INFO}

aws:
  s3:
    bucket: ${AWS_BUCKET}
    region: ${AWS_REGION}
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
  writer-with-order-by-keys: true
