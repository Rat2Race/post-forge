app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  oauth2:
    redirect-url: ${APP_OAUTH2_REDIRECT_URL}
    callback-base-url: ${APP_OAUTH2_CALLBACK_BASE_URL:http://localhost:8080}
  email:
    verification-base-url: ${APP_EMAIL_VERIFICATION_BASE_URL}

spring:
  config:
    import: optional:classpath:application-monitoring.yml,optional:file:.env[.properties],optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  ai:
    openai:
      provider: ${LLM_PROVIDER:ollama}
      api-key: ${OPENAI_API_KEY:}
      chat:
        base-url: ${LLM_CHAT_BASE_URL:${LLM_GATEWAY_BASE_URL:http://localhost:8088}}
        api-key: ${LLM_CHAT_API_KEY:${LLM_GATEWAY_TOKEN:}}
        options:
          model: ${LLM_CHAT_MODEL:qwen3:8b}
      embedding:
        base-url: ${LLM_EMBEDDING_BASE_URL:https://api.openai.com}
        api-key: ${LLM_EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
        options:
          model: ${LLM_EMBEDDING_MODEL:text-embedding-ada-002}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: ${LLM_EMBEDDING_DIMENSIONS:1536}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 1000

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${app.oauth2.callback-base-url}/login/oauth2/code/google
            scope: profile, email
          naver:
            authorization-grant-type: authorization_code
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: ${app.oauth2.callback-base-url}/login/oauth2/code/naver
            scope: name, email, nickname
            client-authentication-method: client_secret_post
          kakao:
            authorization-grant-type: authorization_code
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${app.oauth2.callback-base-url}/login/oauth2/code/kakao
            scope: profile_nickname, account_email
            client-authentication-method: client_secret_post
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

source:
  mock-product:
    enabled: ${MOCK_PRODUCT_SOURCE_ENABLED:true}
  naver-shopping:
    enabled: ${NAVER_SHOPPING_ENABLED:false}
    client-id: ${NAVER_SEARCH_CLIENT_ID:}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET:}
    sort: ${NAVER_SHOPPING_SORT:sim}
    exclude: ${NAVER_SHOPPING_EXCLUDE:used:rental:cbshop}
  naver-news:
    enabled: ${NAVER_NEWS_ENABLED:false}
    client-id: ${NAVER_SEARCH_CLIENT_ID:}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET:}
    sort: ${NAVER_NEWS_SORT:date}
    display: ${NAVER_NEWS_DISPLAY:10}

postforge:
  time:
    zone: ${POSTFORGE_TIME_ZONE:Asia/Seoul}

auth:
  login:
    protection:
      enabled: true
      rate-limit-window-seconds: 60
      user-limit-per-window: 10
      ip-limit-per-window: 30
      failure-window-seconds: 300
      failure-limit: 5
      lock-seconds: 300

jwt:
  secret: ${JWT_SECRET}
  accessTokenValidity: 15
  refreshTokenValidity: 7

logging:
  level:
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY:INFO}
    org.springframework.security.oauth2: ${LOG_LEVEL_SPRING_SECURITY_OAUTH2:INFO}
    dev.iamrat: ${LOG_LEVEL_APP:INFO}

aws:
  s3:
    bucket: ${AWS_BUCKET}
    region: ${AWS_REGION}
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
  writer-with-order-by-keys: true
