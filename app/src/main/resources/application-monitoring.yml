management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      access: read-only
  metrics:
    tags:
      application: postforge
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,2s

monitoring:
  username: ${MONITORING_USERNAME}
  password: ${MONITORING_PASSWORD}
