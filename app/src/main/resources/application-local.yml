spring:
  config:
    import: optional:file:.env.local[.properties],optional:file:../.env.local[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}

  data:
    redis:
      host: ${REDIS_HOST:localhost}

  mail:
    host: localhost
    port: 1025
    username: postforge@localhost

app:
  llm:
    chat:
      base-url: ${LLM_CHAT_BASE_URL:${LLM_GATEWAY_BASE_URL:http://localhost:11434}}
      options:
        model: ${LLM_CHAT_MODEL:qwen3:8b}
    embedding:
      base-url: ${LLM_EMBEDDING_BASE_URL:${LLM_GATEWAY_BASE_URL:http://localhost:11434}}
      options:
        model: ${LLM_EMBEDDING_MODEL:bge-m3}
