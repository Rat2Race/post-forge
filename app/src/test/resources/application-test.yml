spring:
  datasource:
    url: jdbc:h2:mem:app-context-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  ai:
    vectorstore:
      pgvector:
        initialize-schema: false

source:
  naver-news:
    enabled: false

ingest:
  news:
    launch:
      scheduler:
        enabled: false
    digest:
      scheduler:
        enabled: false

