spring:
  # Testcontainers가 compose·운영과 같은 PostgreSQL 이미지를 띄운다. Flyway V0000으로 스키마를 만들고 엔티티와 대조한다.
  datasource:
    url: jdbc:tc:pgvector:0.8.2-pg18-trixie:///postforge
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: localhost   # JavaMailSender 빈만 만든다. 테스트는 발송하지 않는다.

APP_FRONTEND_BASE_URL: http://localhost:3000
APP_API_BASE_URL: http://localhost:8080
LLM_GATEWAY_BASE_URL: http://localhost:8088
LLM_CHAT_MODEL: qwen3:8b
GOOGLE_CLIENT_ID: dummy-google-client-id
GOOGLE_CLIENT_SECRET: dummy-google-secret
NAVER_CLIENT_ID: dummy-naver-client-id
NAVER_CLIENT_SECRET: dummy-naver-secret
KAKAO_CLIENT_ID: dummy-kakao-client-id
KAKAO_CLIENT_SECRET: dummy-kakao-secret
JWT_SECRET: test-only-jwt-secret-key-postforge-0123456789abcdef0123456789
MONITORING_USERNAME: monitor
MONITORING_PASSWORD: monitor-secret
